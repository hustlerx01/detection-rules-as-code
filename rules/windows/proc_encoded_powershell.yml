title: Encoded PowerShell command line
id: bad3751d-381c-5a52-8a81-4018faa295af
status: experimental
description: Encoded PowerShell command line. Part of Ansar Shaikh's detection-as-code
  lab.
author: Ansar Shaikh
date: 2026/10/11
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_enc:
    CommandLine|contains:
    - ' -enc '
    - ' -encodedcommand '
    - ' -e '
  condition: selection_img and selection_enc
falsepositives:
- Some SCCM / management agents
level: high
