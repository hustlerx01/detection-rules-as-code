title: Shadow copy deletion (ransomware precursor)
id: dd389f70-0eb3-5623-ae4e-89d999b7413e
status: experimental
description: Shadow copy deletion (ransomware precursor). Part of Ansar Shaikh's detection-as-code
  lab.
author: Ansar Shaikh
date: 2026/10/11
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  vss:
    Image|endswith: \vssadmin.exe
    CommandLine|contains|all:
    - delete
    - shadows
  wmic:
    Image|endswith: \wmic.exe
    CommandLine|contains|all:
    - shadowcopy
    - delete
  condition: vss or wmic
falsepositives:
- Backup software housekeeping
level: critical
