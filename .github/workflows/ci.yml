name: detection-ci
on: [push, pull_request]
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - name: Lint rules + pySigma conversion to Splunk
        run: python -m dac.validate
      - name: Replay TP/FP samples against every rule
        run: python -m dac.runtests
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with: {name: splunk-queries, path: results/splunk/}
